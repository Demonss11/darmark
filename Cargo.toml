[workspace]
resolver = "2"
members = ["crates/md-core", "crates/app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Профиль релиза: максимально лёгкий бинарник (недокументированные фичи отключены,
# линковка с LTO и strip — в tauri.conf / Cargo ниже)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
