[workspace]
resolver = "2"
# lua-proto — прототип/спайк, живёт только в ветке proto/lua-plugin-host
members = ["crates/md-core", "crates/app/src-tauri", "crates/lua-proto", "crates/lua-rpc-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Профиль релиза: максимально лёгкий бинарник (недокументированные фичи отключены,
# линковка с LTO и strip — в tauri.conf / Cargo ниже)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Прототипный стенд: Lua-ошибка из Rust-callback (hook/host-функция) разворачивается через SEH
# и несовместима с panic="abort" → отдельный профиль, не затрагивающий релиз darmark.
[profile.proto]
inherits = "release"
panic = "unwind"
