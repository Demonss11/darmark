[workspace]
resolver = "2"
# plugin-proto/plugin-host — продуктовая плагинная система (H2). lua-proto/lua-rpc-spike —
# прототип/спайк: перенос блоков завершён (Фаза 0), но они остаются источником фикстур
# crash/hang/chatty/edit для гейта Фазы 2 и потому держатся в workspace до неё. CI их не гоняет.
members = [
  "crates/md-core",
  "crates/app/src-tauri",
  "crates/plugin-proto",
  "crates/plugin-host",
  "crates/lua-proto",
  "crates/lua-rpc-spike",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Профиль релиза: максимально лёгкий бинарник (недокументированные фичи отключены,
# линковка с LTO и strip — в tauri.conf / Cargo ниже)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Прототипный стенд: Lua-ошибка из Rust-callback (hook/host-функция) разворачивается через SEH
# и несовместима с panic="abort" → отдельный профиль, не затрагивающий релиз darmark.
[profile.proto]
inherits = "release"
panic = "unwind"
