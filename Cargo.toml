[workspace]
resolver = "2"
# plugin-core/plugin-host — продуктовая плагинная система (H2).
members = [
  "crates/md-core",
  "crates/mcp-core",
  "crates/app/src-tauri",
  "crates/plugin-core",
  "crates/plugin-host",
  "crates/plugin-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Профиль релиза: максимально лёгкий бинарник (недокументированные фичи отключены,
# линковка с LTO и strip — в tauri.conf / Cargo ниже)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
