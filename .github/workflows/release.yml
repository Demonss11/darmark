name: Release

# Релизный workflow (S7 плана tasks/TZ-STABILIZATION.md).
#
# Запуск:
#   - push тега вида `v*` (например v0.1.0) — сборка + приложение к GitHub Release;
#   - workflow_dispatch — ручной прогон (только сборка и артефакт, без Release).
#
# Что делает: собирает NSIS-установщик (внутри — darmark.exe + sidecar'ы плагинной
# подсистемы darmark-plugin-host.exe/darmark-plugin.exe), прогоняет guard-проверки
# и прикладывает установщик к артефактам/Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# contents: write нужен softprops/action-gh-release для создания/обновления Release по тегу.
permissions:
  contents: write

jobs:
  release:
    name: build NSIS installer
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Node 20 + кэш npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/app/package-lock.json

      - name: npm ci
        working-directory: crates/app
        run: npm ci

      # `npx tauri build` сам делает всё нужное, дублировать шаги не нужно:
      #   1) beforeBuildCommand = `npm run build && npm run sidecars` — собирает фронт
      #      (tsc + vite) и стейджит sidecar'ы (`crates/app/scripts/prepare-sidecars.mjs`).
      #      Стейджинг обязателен ДО компиляции `darmark`: build.rs (tauri-build) копирует
      #      `bundle.externalBin` рядом с бинарником и падает без `binaries/*-<triple>.exe`;
      #   2) собирает darmark.exe в релизном профиле (opt-level="s", LTO, strip, panic=abort);
      #   3) упаковывает NSIS-установщик.
      # Отдельный `npm run sidecars` здесь НЕ вызываем — иначе sidecar'ы собирались бы дважды.
      - name: tauri build (frontend + sidecars + NSIS)
        working-directory: crates/app
        run: npx tauri build

      # Проверка 1: установщик реально появился в каталоге сборки (иначе релизить нечего).
      - name: проверка установщика
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          $installers = Get-ChildItem -Path $dir -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installers) { throw "не найден NSIS-установщик в $dir/*-setup.exe — сборка не дала артефакт" }
          $installers | ForEach-Object { "{0} = {1:N2} МиБ" -f $_.FullName, ($_.Length / 1MB) }

      # Бюджет установщика (S9): darmark.exe + sidecar'ы в одном NSIS-архиве (сжатие LZMA).
      # Лимит 4 МиБ — с запасом на будущую подпись кода; сейчас ≈1.7 МиБ.
      - name: "бюджет установщика (≤ 4 МиБ)"
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          $limit = 4 * 1024 * 1024
          $installers = Get-ChildItem -Path $dir -Filter "*-setup.exe"
          foreach ($f in $installers) {
            "{0} = {1:N2} МиБ; лимит {2:N2} МиБ" -f $f.Name, ($f.Length / 1MB), ($limit / 1MB)
            if ($f.Length -gt $limit) { throw "установщик превышает бюджет 4 МиБ: $($f.Length) > $limit" }
          }

      # Проверка 2 (D6/ADR-0021): GUI-хост не должен линковать mlua — Lua живёт только в child.
      - name: "guard: mlua не просочился в darmark"
        shell: pwsh
        run: |
          $tree = cargo tree -p darmark
          $leak = $tree | Select-String -Pattern 'mlua'
          if ($leak) {
            $leak | ForEach-Object { Write-Host $_ }
            throw "mlua просочился в darmark (D6/ADR-0021): GUI-хост обязан оставаться без Lua-рантайма"
          }
          "cargo tree -p darmark не содержит mlua"

      - name: upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: darmark-nsis-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/darmark.exe
          if-no-files-found: error

      # Release создаётся только по тегу `v*`; ручной запуск (workflow_dispatch) его не трогает.
      - name: attach to GitHub Release (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/darmark.exe
          generate_release_notes: true
          # TODO: подпись кода (Authenticode) для darmark.exe и установщика — вне области S7.
          # TODO: нотаризация / SmartScreen-репутация — вне области S7.
