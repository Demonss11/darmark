[package]
name = "plugin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Транспорт/конверт/Job/карантин/манифест плагинной системы darmark (без mlua, без Tauri)"

[dependencies]
# serde-конверт хост ↔ child (скилл `plugin-sandbox`). mlua здесь НЕ бывает: крейт линкуется
# и в GUI-хост, который обязан оставаться без Lua-рантайма.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
