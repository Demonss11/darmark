[package]
name = "mdedit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight Notepad++-style Markdown editor/viewer (Tauri shell over md-core)"

[lib]
name = "mdedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Только нужные фичи — ради минимального бинарника
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-core = { path = "../../md-core" }

# Windows-only: доступ к настройкам WebView2. Браузерные акселераторы (Ctrl+P —
# печать, F5, Ctrl+F и т.п.) перехватывают хоткеи приложения, поэтому их надо
# выключить через ICoreWebView2Settings3.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
