[package]
name = "darmark"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight Notepad++-style Markdown editor/viewer (Tauri shell over md-core)"

[lib]
name = "darmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Только нужные фичи — ради минимального бинарника.
# protocol-asset — asset-протокол для локальных картинок в предпросмотре (см. images.ts).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-core = { path = "../../md-core" }
plugin-core = { path = "../../plugin-core" }
# MCP (ADR-0036): протокольное ядро + каталог плагинов. `plugin-catalog` — чистый крейт
# (без `mlua`/Tauri), поэтому подключение не ломает «`mlua` вне GUI» (ADR-0021).
mcp-core = { path = "../../mcp-core" }
plugin-catalog = { path = "../../plugin-catalog" }
# Асинхронный сон вместо блокирующего `thread::sleep` в async-путях AI (rate limit/ретрай).
# Фича `time` — минимум; рантайм предоставляет Tauri (tokio уже в дереве).
tokio = { version = "1", default-features = false, features = ["time"] }

# Windows-only: доступ к настройкам WebView2. Браузерные акселераторы (Ctrl+P —
# печать, F5, Ctrl+F и т.п.) перехватывают хоткеи приложения, поэтому их надо
# выключить через ICoreWebView2Settings3.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# AI-сетевой слой (ADR-0032/0033): reqwest + системный TLS SChannel (native-tls, без OpenSSL),
# стриминг SSE. Только Windows — на не-Windows сетевой слой AI не собирается (ADR-0033 §2.1).
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "json",
  "stream",
] }
# Потоковое чтение SSE-ответа (`Response::bytes_stream` + `StreamExt::next`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# WinAPI-путь ресурс-монитора (ADR-0031 §2.1 п.2): прямой доступ к
# K32GetProcessMemoryInfo/GetProcessTimes/GetProcessHandleCount. Фичи minimal — крейт уже в
# дереве darmark (windows 0.62.2), новых зависимостей не появляется (F53).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

[dev-dependencies]
tempfile = "3"
