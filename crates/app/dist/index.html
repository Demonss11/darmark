<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdedit</title>
    <script type="module" crossorigin src="/assets/index-BxcJcFQ7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-u5wzL0d1.css">
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-new" title="Новый файл (Ctrl+N)">Новый</button>
        <button id="btn-open" title="Открыть (Ctrl+O)">Открыть</button>
        <button id="btn-save" title="Сохранить (Ctrl+S)">Сохранить</button>
        <button id="btn-save-as" title="Сохранить как (Ctrl+Shift+S)">Сохранить как…</button>
        <span id="file-label">безымянный</span>
        <button id="btn-inspect" title="Инспектор (Ctrl+I)">⌕ Инспектор</button>
        <label id="toggle-sync" title="Синхронная прокрутка редактора и предпросмотра">
          <input type="checkbox" id="chk-sync" checked /> синхронно
        </label>
        <label id="toggle-preview" title="Показать/скрыть предпросмотр (Ctrl+P)">
          <input type="checkbox" id="chk-preview" checked /> предпросмотр
        </label>
      </header>
      <main id="panes">
        <textarea
          id="editor"
          spellcheck="false"
          wrap="off"
          placeholder="# Начните печатать markdown…"
        ></textarea>
        <article id="preview" class="markdown-body"></article>
      </main>
      <footer id="statusbar">
        <span id="stat-pos">Стр 1, Кол 1</span>
        <span id="stat-size">0 симв.</span>
        <span id="stat-inspect" hidden>Режим инспектора</span>
        <span id="stat-msg"></span>
      </footer>
    </div>
  </body>
</html>
