<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e12" />
    <title>darmark</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <div id="app">
      <!-- ============ ТУЛБАР ============ -->
      <header id="toolbar" class="toolbar">
        <div class="brand">
          <span class="brand-mark">d</span>
          <span>darmark</span>
        </div>

        <!-- файловые команды (иконки, id заморожены) -->
        <div class="file-actions">
          <button type="button" class="tbtn" id="btn-new" title="Новый файл (Ctrl+N)" aria-label="Новый файл">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="12" x2="12" y2="18" />
              <line x1="9" y1="15" x2="15" y2="15" />
            </svg>
          </button>
          <button type="button" class="tbtn" id="btn-open" title="Открыть (Ctrl+O)" aria-label="Открыть">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
            </svg>
          </button>
          <button type="button" class="tbtn" id="btn-save" title="Сохранить (Ctrl+S)" aria-label="Сохранить">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
          </button>
          <button type="button" class="tbtn" id="btn-save-as" title="Сохранить как… (Ctrl+Shift+S)" aria-label="Сохранить как">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
              <line x1="12" y1="11" x2="12" y2="15" />
              <line x1="10" y1="13" x2="14" y2="13" />
            </svg>
          </button>
        </div>

        <!-- текущий документ -->
        <div class="file-chip" id="file-chip" title="Текущий документ">
          <span class="fname" id="file-label">безымянный</span>
        </div>

        <div class="spacer"></div>

        <!-- форматирование (icon-only) -->
        <div class="format-group" id="format-group">
          <button type="button" class="tbtn" data-action="bold" title="Жирный (Ctrl+B)" aria-label="Жирный">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
              <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
            </svg>
          </button>
          <button type="button" class="tbtn" data-action="italic" title="Курсив" aria-label="Курсив">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="19" y1="4" x2="10" y2="4" />
              <line x1="14" y1="20" x2="5" y2="20" />
              <line x1="15" y1="4" x2="9" y2="20" />
            </svg>
          </button>
          <button type="button" class="tbtn" data-action="code" title="Код" aria-label="Код">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
          </button>
          <button type="button" class="tbtn" data-action="heading" title="Заголовок" aria-label="Заголовок">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 4v16M18 4v16M6 12h12" />
            </svg>
          </button>
          <button type="button" class="tbtn" data-action="link" title="Ссылка" aria-label="Ссылка">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          </button>
        </div>

        <div class="div-v"></div>

        <!-- палитра команд: ЗАГЛУШКА -->
        <button class="palette-trigger" id="palette-trigger" type="button" title="Палитра команд (Ctrl+K) — скоро">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="4 17 10 11 4 5" />
            <line x1="12" y1="19" x2="20" y2="19" />
          </svg>
          <span>Команды</span>
          <kbd>Ctrl+K</kbd>
        </button>

        <div class="div-v"></div>

        <!-- тумблеры (id сохранены: e2e кликает #chk-*) -->
        <label class="tbtn" id="toggle-sync" title="Синхронная прокрутка">
          <input
            class="toggle-input"
            type="checkbox"
            id="chk-sync"
            checked
            role="switch"
            aria-label="Синхронная прокрутка"
          />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
        </label>
        <label class="tbtn" id="toggle-preview" title="Показать/скрыть предпросмотр (Ctrl+P)">
          <input
            class="toggle-input"
            type="checkbox"
            id="chk-preview"
            checked
            role="switch"
            aria-label="Предпросмотр"
          />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </label>

        <div class="div-v"></div>

        <!-- наш инспектор (не путать с дровером idea5) -->
        <button type="button" class="tbtn" id="btn-inspect" title="Инспектор (Ctrl+I)" aria-label="Инспектор">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </header>

      <!-- ============ РАБОЧАЯ ОБЛАСТЬ ============ -->
      <div class="workspace">
        <!-- rail -->
        <nav class="rail">
          <button type="button" class="rail-btn active" id="rail-explorer" title="Файлы" aria-label="Файлы" aria-pressed="true">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
            </svg>
          </button>
          <button type="button" class="rail-btn" id="rail-plugins" title="Плагины" aria-label="Плагины">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
            </svg>
          </button>
          <div class="spacer"></div>
          <button type="button" class="rail-btn" id="rail-logs" title="Журнал — скоро" aria-label="Журнал">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="4 17 10 11 4 5" />
              <line x1="12" y1="19" x2="20" y2="19" />
            </svg>
          </button>
        </nav>

        <!-- сворачиваемый sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="side-panel" id="panel-explorer">
            <div class="side-head"><span class="side-title">Файлы</span></div>
            <div class="tree" id="tree">
              <div class="side-empty">скоро</div>
            </div>
          </div>
          <div class="side-panel" id="panel-plugins" hidden>
            <div class="side-head"><span class="side-title">Плагины</span></div>
            <div class="pl-panel">
              <!-- контейнер менеджера плагинов (H2, Фаза 5); заполняет pluginManager.ts -->
              <div id="plugin-manager"></div>
            </div>
          </div>
        </aside>

        <!-- main -->
        <main class="main" id="main-content" tabindex="-1">
          <!-- Видимого заголовка в UI нет — даём скринридерам точку входа в main. -->
          <h1 class="visually-hidden">darmark — редактор Markdown</h1>
          <div class="tabrow">
            <div class="tab-strip" id="tab-strip">
              <div class="tab active" id="tab-current">
                <span class="name" id="tab-name">безымянный</span>
                <span class="dirty" id="tab-dirty" hidden aria-hidden="true"></span>
              </div>
            </div>
          </div>

          <div id="panes" class="panes">
            <section class="pane pane-editor" id="pane-a" data-pane="pane-editor" data-view="editor">
              <div class="pane-head">
                <div class="view-switch" id="view-switch-a">
                  <button class="vtab core active" type="button" aria-current="true">
                    <span class="origin"></span>Редактор
                  </button>
                </div>
              </div>
              <div class="editor-wrap">
                <div class="line-numbers" id="gutter" aria-hidden="true">1</div>
                <textarea
                  id="editor"
                  spellcheck="false"
                  wrap="off"
                  aria-label="Редактор Markdown"
                  placeholder="# Начните печатать markdown…"
                ></textarea>
              </div>
            </section>

            <div class="divider" id="divider"></div>

            <section
              class="pane pane-preview"
              id="pane-b"
              data-pane="pane-preview"
              data-view="preview"
            >
              <div class="pane-head" id="pane-b-head">
                <div class="view-switch" id="view-switch">
                  <button class="vtab core active" type="button" aria-current="true">
                    <span class="origin"></span>Предпросмотр
                  </button>
                </div>
              </div>
              <article id="preview" class="markdown-body"></article>
              <!-- плагинное тир-1 view (H2): отдельный контейнер, innerHTML пишет pluginViews.ts -->
              <article id="plugin-view" class="markdown-body plugin-view" hidden></article>
            </section>
          </div>
        </main>
      </div>

      <!-- ============ СТАТУСБАР ============ -->
      <footer id="statusbar" class="statusbar">
        <span class="stat"><span class="stat-dot" aria-hidden="true"></span><span id="stat-state">Готов</span></span>
        <span class="stat" id="stat-msg" role="status" aria-live="polite"></span>
        <span class="spacer"></span>
        <span class="stat" id="stat-block">—</span>
        <span class="stat" id="stat-pos">Стр 1, Кол 1</span>
        <span class="stat" id="stat-size">0 симв.</span>
        <span class="stat accent" id="stat-inspect" hidden role="status" aria-live="polite"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
